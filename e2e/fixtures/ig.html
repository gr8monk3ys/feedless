<!doctype html>
<html>
<head><meta charset="utf-8"><title>ig fixture</title></head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/reels/">Reels</a>
    <a href="/explore/">Explore</a>
    <a href="/direct/inbox/">Messages</a>
    <!-- notification badge (nav rail / floating pill) -->
    <div aria-label="Direct messaging - 1 new notification link">1</div>
    <!-- heart icon: unlabelled red dot is the div after the svg wrapper -->
    <div>
      <div><svg aria-label="Notifications" role="img"></svg></div>
      <div class="dot"></div>
    </div>
  </nav>
  <main>
    <!-- stories tray -->
    <div>
      <ul>
        <li><button><canvas width="66" height="66"></canvas></button></li>
        <li><button><canvas width="66" height="66"></canvas></button></li>
      </ul>
    </div>
    <!-- feed -->
    <div role="feed">
      <article>
        <img alt="Photo by someone" />
        <a href="/p/abc123/liked_by/">42 likes</a>
      </article>
    </div>
    <!-- post-page action row: numeric counts next to Share icon -->
    <section>
      <div>
        <svg aria-label="Share" role="img"></svg>
        <span role="button">9</span>
        <span role="button">6</span>
      </div>
    </section>
    <!-- comment row: <time> inside a profile link, five divs up = the row.
         The caption's <time> is NOT inside a link, so it never matches. -->
    <div class="comment-row">
      <div>
        <div>
          <div>
            <div>
              <span><a role="link" href="/someuser/"><time datetime="2026-07-09">3h</time></a></span>
              <span>commenter</span>
            </div>
            <div>the comment text</div>
          </div>
        </div>
      </div>
    </div>
    <!-- suggested accounts sidebar -->
    <div>
      <div><span>Suggested for you</span> <a href="/explore/people/">See All</a></div>
    </div>
  </main>
</body>
</html>
