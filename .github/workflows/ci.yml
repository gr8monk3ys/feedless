name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run compile
      - run: bun run generate && git diff --exit-code src/css
      - run: bun run test
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - run: bun run build
